[package]
name = "trend-iq-desktop"
version = "0.1.0"
description = "Trend IQ - 股票技术分析工具"
authors = ["Trend IQ"]
edition = "2021"

[lib]
name = "trend_iq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
urlencoding = "2"
